name: Daily Python skill migration
on:
  schedule:
    # 01:30 UTC = 07:00 Asia/Kolkata (IST).
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Evaluate only; no queue changes, publication or Telegram'
        type: boolean
        default: false
      retry_today:
        description: 'Retry an unfinished day after manual repair (never a completed publication)'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: daily-python-skill-migration
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.repository == 'gkmraju/codex-skill-creator' && github.ref == 'refs/heads/main' && (vars.CLOUD_RUNNER_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check daily deduplication
        id: plan
        run: python -B -m skill_migration.cloud plan
        env:
          RETRY_TODAY: ${{ inputs.retry_today || 'false' }}
      - name: Identify browser requirements
        if: steps.plan.outputs.run == 'true'
        id: tools
        shell: bash
        run: |
          python -B - <<'PY'
          import os
          from skill_migration.cloud import ROOT, needs_browser
          browser = needs_browser(ROOT)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('browser=' + str(browser).lower() + '\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.tools.outputs.browser == 'true'
        with:
          node-version: '22'
      - name: Install fixture browser
        if: steps.tools.outputs.browser == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/skill-browser" playwright@1.62.1
          "$RUNNER_TEMP/skill-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Convert and test upstream skill without publishing credentials
        if: steps.plan.outputs.run == 'true'
        run: python -B -m skill_migration.cloud evaluate
        env:
          NODE_PATH: ${{ runner.temp }}/skill-browser/node_modules
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Save evaluation data and raw test logs
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evaluation
          path: |
            tmp/cloud-result.json
            tmp/auto-conversion.zip
            tmp/cloud-logs/
          if-no-files-found: warn
          retention-days: 7

  record:
    needs: evaluate
    if: always() && !inputs.dry_run && needs.evaluate.result != 'skipped' && needs.evaluate.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Trusted control code, not the evaluated upstream tree.
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: evaluation
          path: tmp
      - name: Record outcome or publish gated skill
        run: python -B -m skill_migration.cloud finalize
        env:
          SKILL_PUBLISH_TOKEN: ${{ secrets.SKILL_PUBLISH_TOKEN }}
      - name: Persist queue, report and notification reservation
        run: python -B scripts/cloud_checkpoint.py
        env:
          SKILL_PUBLISH_TOKEN: ${{ github.token }}
      - name: Send actual outcome to Telegram
        id: telegram
        continue-on-error: true
        run: python -B -m skill_migration.cloud notify
        env:
          TELEGRAM_ENABLED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Persist delivery result
        if: always()
        run: python -B scripts/cloud_checkpoint.py
        env:
          SKILL_PUBLISH_TOKEN: ${{ github.token }}
      - name: Surface report in Actions
        if: always()
        shell: bash
        run: |
          python -B - <<'PY'
          import os
          from skill_migration.cloud import ROOT, date_ist, run_folder
          folder = run_folder(ROOT, {'date': date_ist()})
          summary = folder / 'summary.md'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary.read_text() if summary.exists() else 'Run failed before checkpoint. Inspect logs.')
          PY
      - name: Preserve public checkpoint on persistence failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-checkpoint
          path: |
            reports/cloud/
            registry/queue-state.json
            registry/cloud-state.json
          retention-days: 14
      - name: Fail visibly if Telegram did not confirm
        if: steps.telegram.outcome == 'failure'
        run: exit 1
