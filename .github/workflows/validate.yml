name: Local validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m skill_migration validate

  recipe-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Install fixture browser
        run: |
          npm install --prefix "$RUNNER_TEMP/skill-browser" playwright@1.62.1
          "$RUNNER_TEMP/skill-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Reproduce the real reviewed conversion without LLM usage
        run: python -B -m skill_migration.cloud recipe-check --recipe animation-performance-v1
        env:
          NODE_PATH: ${{ runner.temp }}/skill-browser/node_modules
          PYTHONDONTWRITEBYTECODE: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: recipe-check-logs
          path: tmp/cloud-logs/
          retention-days: 7
