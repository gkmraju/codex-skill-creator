name: Validate Codex skill
'on':
- push
- pull_request
- workflow_dispatch
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        python:
        - '3.11'
        - '3.13'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -r skills/polars/requirements.txt
    - run: python -B -m unittest discover -s skills/polars/tests -v
      env:
        PYTHONDONTWRITEBYTECODE: '1'
