prompt = "At 07:00 Asia/Calcutta every day, run the full Claude-to-Codex skill migration workflow in D:\\Codex Projects\\Skill Migration. The control repository is https://github.com/gkmraju/codex-skill-creator. Read AGENTS.md, STATUS.md, docs/daily-workflow.md, docs/registry.md, docs/release-gates.md, and docs/telegram.md; inspect Git state, existing candidates/reports, prior releases, and CI before changing anything. Preserve user work and upstream/installed sources. Apply installed Matt Pocock design, agent-writing, and applicable fixed-commit review guidance plus Codex skill-creator.\n\nThe daily target and completion criterion is at least one impactful Claude-origin skill fully adapted, behaviorally tested, installable in Codex, and publicly published in its own gkmraju/codex-skill-<slug> repository. Target software developers only for now. Select Claude-origin skills whose primary practical value is software development: coding, debugging, testing, architecture, developer tooling, security engineering, accessibility engineering, documentation or developer productivity. Broad quality/manufacturing, consumer or business workflows do not qualify merely because their implementation contains code. Continue searching public GitHub repositories, relevant news and communities until a suitable candidate is found; there is no three-candidate limit. Use dated reproducible queries and record source stars, maintenance, author, and immutable revision. Prioritize well-starred maintained sources with strong practical value; popularity alone is not qualification.\n\nCheck the wider Codex ecosystem, not only locally installed skills: official/OpenAI skills, installed skills, and publicly available Codex-compatible implementations. Reject existing equivalents, sources already providing the same Codex workflow, and prior gkmraju migrations. Compare purpose, triggers, workflow, outputs, dependencies, and source identity. Do not claim universal absence when only a scoped search was possible; record scope and uncertainty. Review actual per-skill license and notices, scripts, dependencies, runtime assumptions, and redistribution rights. If a candidate fails, retain the reason and keep searching rather than treating assessment as the daily deliverable.\n\nFor a qualifying candidate, create an independent repository containing ONLY the selected skill and necessary supporting resources. A literal fork of a whole collection is not required. Preserve attribution, source URL/commit, licenses/notices, and modification history. Adapt everything necessary for real Codex use: instructions, tooling, scripts, templates, dependencies, installation, failure handling, and user-facing examples. Exercise realistic activation and non-activation/failure cases, supporting resources, generated artifacts, and fresh installation in an isolated task-owned directory. Fix observed failures and capture real outputs. Structural checks, copied files, draft instructions, and a promising assessment do not complete the job.\n\nUse the project inventory, assessment, evidence, staging, validation, release-check, and packaging tools. Complete compatibility, functional, security, and review evidence against the final artifact. The user authorizes creating the separate public skill repository, committing, pushing, and publishing the verified skill without an extra routine confirmation once all gates pass. Reuse an existing correct repository instead of creating duplicates; preserve remote work, never force-push, and do not merge unrelated work. Provide skill-specific CI and wait for completed successful runs. An incomplete migration or failed/queued CI must remain unfinished. Do not accept legal attestations or terms, change credentials, access a live third-party system beyond the authorized workflow, or modify installed/upstream skills. If an external prerequisite blocks one candidate, select another achievable candidate where possible.\n\nUpdate the registry and durable status with actual source/commit, functional/install evidence, public repository URL, pushed commit, completed CI, reports, blockers, and next step. Record measured run/implementation durations with their precise scope. Never invent license permission, Codex compatibility, adoption, impact measurements, prompts, logs, CI success, or finished releases. The target is one successful public skill each day; if it is not achieved, explicitly report UNFINISHED, state the concrete blocker, and retain work for continuation rather than counting drafts as success.\n\nTelegram reports are authorized to the configured enabled destination in ignored .env.telegram. Use docs/telegram.md and python -m skill_migration.telegram <dated-report-path> --send. Keep the outward report compact, preferably one screen: skill and shipped/unfinished status, a sentence about its benefit and audience, key verification, skills checked plus measured duration, and the individual repository link; include one concrete blocker/next action only when needed. Do not send the full scorecard, all candidates, lengthy estimated impact, or learning sections; keep detail in the dated report. No published label without the actual repository, pushed commit and completed CI evidence. Keep credentials, chat ids, private repository names, and private outputs out of messages and logs. Respect delivery-attempt receipts and do not blindly retry unconfirmed sends. Send a concise completion or unfinished-job report when the daily run has a meaningful outcome; stay quiet for unchanged non-actionable state."
